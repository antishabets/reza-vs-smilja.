<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boks Meč: Reza vs Smilja</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 20px;
        }
        .container {
            width: 80%;
            margin: 0 auto;
        }
        .match-info {
            margin: 20px 0;
        }
        .odds {
            display: flex;
            justify-content: space-between;
        }
        .odds div {
            padding: 10px;
            border: 1px solid #ddd;
            background-color: #fff;
            text-align: center;
        }
    </style>
</head>
<body>

<header>
    <h1>Boks Meč: Reza vs Smilja</h1>
    <p>Meč se održava u Mostaru</p>
</header>

<div class="container">
    <div class="match-info">
        <h2>Kvota za klađenje:</h2>
        <div class="odds">
            <div>
                <h3>Reza</h3>
                <p>Kvota: 1.85</p>
            </div>
            <div>
                <h3>Smilja</h3>
                <p>Kvota: 2.10</p>
            </div>
        </div>
    </div>
</div>

</body>
</html>
