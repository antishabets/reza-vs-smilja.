<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reza vs Smilja - Boks Meč</title>
  <script type="text/javascript" src="https://cdn.emailjs.com/dist/email.min.js"></script>
  <style>
    /* Stilizacija ostaje ista kao i prije */
  </style>
</head>
<body>

  <header>
    <h1>Boks Meč: Reza vs Smilja</h1>
    <p>Meč se održava u Mostaru</p>
    <img src="Gambling logo with name_ AntishaBets.jpg" alt="AntishaBets Logo">
  </header>

  <section>
    <h2>Kvote za klađenje</h2>

    <form id="betForm">
      <label>Odaberi opciju za klađenje:</label><br><br>

      <input type="radio" name="bet" value="1.70" data-label="Smilja pobjeđuje"> Smilja pobjeđuje (1.70)<br>
      <input type="radio" name="bet" value="2.20" data-label="Reza pobjeđuje"> Reza pobjeđuje (2.20)<br>
      <input type="radio" name="bet" value="3.00" data-label="Pobjeda nokautom"> Pobjeda nokautom (3.00)<br>
      <input type="radio" name="bet" value="2.50" data-label="Preko 3.5 runde"> Preko 3.5 runde (2.50)<br><br>

      <label for="name">Unesi ime:</label><br>
      <input type="text" id="name" required><br><br>

      <label for="amount">Unesi ulog (KM):</label>
      <input type="number" id="amount" required><br><br>

      <label for="userEmail">Unesite svoj e-mail:</label><br>
      <input type="email" id="userEmail" required><br><br>

      <button type="submit">Izračunaj dobitak</button>
    </form>

    <div id="result" style="margin-top: 15px; font-weight: bold;"></div>

    <div id="lastBet" style="margin-top: 25px; font-style: italic;"></div>
  </section>

  <footer>
    <p>Za prijedloge novih kvota pošaljite email na: <a href="mailto:antishabets@gmail.com">antishabets@gmail.com</a></p>
  </footer>

  <script>
    // Inicijalizacija EmailJS
    emailjs.init('nZny1t8iDvgDELtzx'); // Unesi svoj korisnički ID sa EmailJS

    // Forma za klađenje
    document.getElementById('betForm').addEventListener('submit', function(e) {
      e.preventDefault();

      // Logovi za praćenje grešaka
      console.log("Forma je poslana");

      const betOptions = document.getElementsByName('bet');
      let selectedValue = null;
      let selectedLabel = null;

      for (const option of betOptions) {
        if (option.checked) {
          selectedValue = parseFloat(option.value);
          selectedLabel = option.dataset.label;
          break;
        }
      }

      const name = document.getElementById('name').value.trim();
      const amount = parseFloat(document.getElementById('amount').value);
      const userEmail = document.getElementById('userEmail').value.trim();

      if (!name || !selectedValue || amount <= 0 || !userEmail) {
        document.getElementById('result').innerText = "Molimo unesite ime, odaberite opciju, unesite ispravan ulog i email.";
        return;
      }

      const rawWin = selectedValue * amount;
      const taxedWin = (rawWin * 0.90).toFixed(2); // 10% porez

      console.log(`Izračunat dobitak: ${taxedWin}`);

      document.getElementById('result').innerHTML =
        `Odabrao si: <b>${selectedLabel}</b><br>Ulog: <b>${amount} KM</b><br>Potencijalni dobitak (nakon poreza): <b>${taxedWin} KM</b>`;

      // Šaljemo email putem EmailJS
      emailjs.send('nZny1t8iDvgDELtzx', 'template_je9irtk', {
        name: name,
        option: selectedLabel,
        stake: amount,
        winAfterTax: taxedWin,
        user_email: userEmail  // Dodajemo korisnički email u tijelo poruke
      })
      .then(function(response) {
        console.log('Email poslan', response);
        alert("Vaša opklada je prihvaćena! Provjerite svoj e-mail za potvrdu.");
      }, function(error) {
        console.error('Greška u slanju emaila', error);
        alert("Došlo je do greške prilikom slanja e-maila. Molimo pokušajte ponovo.");
      });
    });
  </script>

</body>
</html>
