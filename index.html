<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reza vs Smilja - Boks Meč</title>
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f4f4f4;
      padding: 20px;
    }
    .container {
      background: #fff;
      border-radius: 10px;
      padding: 30px;
      max-width: 500px;
      margin: auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h1 {
      margin-bottom: 10px;
    }
    select, input {
      padding: 10px;
      width: 90%;
      margin-bottom: 15px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    button {
      padding: 12px 25px;
      background: #28a745;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }
    .message {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Reza vs Smilja</h1>
    <p>Uplati i osvoji! Kvote:</p>
    <p><strong>Reza: 1.85</strong> | <strong>Smilja: 1.95</strong></p>

    <form id="betForm">
      <input type="text" id="userName" placeholder="Tvoje ime" required /><br/>
      <input type="email" id="userEmail" placeholder="Tvoj email" required /><br/>
      <select id="fighter" required>
        <option value="">Odaberi borca</option>
        <option value="Reza">Reza</option>
        <option value="Smilja">Smilja</option>
      </select><br/>
      <input type="number" id="betAmount" placeholder="Ulog (KM)" required /><br/>
      <button type="submit">Izračunaj dobitak</button>
    </form>

    <div class="message" id="message"></div>
  </div>

  <script>
    (function(){
      emailjs.init("I_6piT7owRGR7uI4V");
    })();

    document.getElementById("betForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const name = document.getElementById("userName").value;
      const email = document.getElementById("userEmail").value;
      const fighter = document.getElementById("fighter").value;
      const amount = parseFloat(document.getElementById("betAmount").value);

      if (!name || !email || !fighter || !amount) {
        document.getElementById("message").textContent = "Molimo popuni sva polja.";
        return;
      }

      let odds = fighter === "Reza" ? 1.85 : 1.95;
      let potentialWin = (amount * odds).toFixed(2);

      const message = `Pozdrav ${name}, uspješno si se kladio na ${fighter} sa ulogom od ${amount} KM. 
Mogući dobitak: ${potentialWin} KM. Hvala na povjerenju!`;

      emailjs.send("service_rqe9tzf", "template_8l6ajyn", {
        user_name: name,
        user_email: email,
        message: message
      })
      .then(function() {
        document.getElementById("message").textContent = "Uspješno si se kladio! Provjeri svoj email.";
        document.getElementById("betForm").reset();
      }, function(error) {
        console.error("Greška pri slanju emaila:", error);
        document.getElementById("message").textContent = "Došlo je do greške pri slanju emaila.";
      });
    });
  </script>
</body>
</html>
